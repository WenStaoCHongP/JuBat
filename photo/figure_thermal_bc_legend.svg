<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f77b4" />
    </marker>
    <linearGradient id="gradHeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fee8c8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fdbb84;stop-opacity:1"/>
    </linearGradient>
    <style>
      .title{font: 700 20px system-ui,Segoe UI,Roboto,Helvetica,Arial}
      .label{font: 600 16px system-ui,Segoe UI,Roboto,Helvetica,Arial}
      .small{font: 400 14px system-ui,Segoe UI,Roboto,Helvetica,Arial}
      .eq{font: 400 14px 'Courier New',monospace}
    </style>
  </defs>

  <!-- Title -->
  <text x="30" y="36" class="title">热边界标注示意图例（Thermal BC Legend）</text>

  <!-- Annulus schematic -->
  <g transform="translate(40, 60)">
    <circle cx="180" cy="150" r="140" fill="url(#gradHeat)" stroke="#999" stroke-width="1"/>
    <circle cx="180" cy="150" r="70" fill="#fff" stroke="#999" stroke-width="1"/>

    <!-- Outer convective boundary arrows -->
    <g stroke="#1f77b4" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M 320 60 L 360 60" />
      <path d="M 330 110 L 370 110" />
      <path d="M 340 160 L 380 160" />
      <path d="M 330 210 L 370 210" />
      <path d="M 320 260 L 360 260" />
    </g>
    <text x="385" y="160" class="label" dominant-baseline="middle">对流边界 Outer: −k ∂T/∂n = h (T − T_amb)</text>
    <text x="385" y="182" class="small">内涵：Bi = h L_th / k_ref；实现为边界项 KT += ∫Bi NᵀN dL</text>

    <!-- Inner adiabatic boundary ticks -->
    <g stroke="#2ca02c" stroke-width="2">
      <line x1="180" y1="80" x2="180" y2="65" />
      <line x1="180" y1="235" x2="180" y2="220" />
      <line x1="115" y1="150" x2="100" y2="150" />
      <line x1="245" y1="150" x2="260" y2="150" />
    </g>
    <text x="20" y="300" class="label">内侧绝热 Inner: −k ∂T/∂n = 0</text>
    <text x="20" y="322" class="small">可选改为对流/辐射；当前默认绝热</text>
  </g>

  <!-- Legend items on the right -->
  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="360" height="270" rx="8" fill="#f8f9fa" stroke="#e0e0e0"/>

    <!-- Convection -->
    <g transform="translate(16, 20)">
      <line x1="0" y1="18" x2="80" y2="18" stroke="#1f77b4" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="92" y="22" class="label">对流（Convection）</text>
      <text x="92" y="44" class="eq">q = h (T − T_amb)</text>
    </g>

    <!-- Adiabatic -->
    <g transform="translate(16, 84)">
      <line x1="0" y1="18" x2="80" y2="18" stroke="#2ca02c" stroke-width="2"/>
      <line x1="20" y1="8" x2="20" y2="28" stroke="#2ca02c" stroke-width="2"/>
      <line x1="60" y1="8" x2="60" y2="28" stroke="#2ca02c" stroke-width="2"/>
      <text x="92" y="22" class="label">绝热（Adiabatic）</text>
      <text x="92" y="44" class="eq">q = 0 ⇔ ∂T/∂n = 0</text>
    </g>

    <!-- Isothermal / Dirichlet -->
    <g transform="translate(16, 152)">
      <rect x="0" y="2" width="80" height="32" fill="#e3f2fd" stroke="#64b5f6" />
      <text x="92" y="22" class="label">恒温（Dirichlet）</text>
      <text x="92" y="44" class="eq">T = T_spec</text>
    </g>

    <!-- Radiation (optional) -->
    <g transform="translate(16, 220)">
      <circle cx="18" cy="18" r="16" fill="none" stroke="#fb8c00" stroke-width="2"/>
      <text x="92" y="22" class="label">辐射（可选）</text>
      <text x="92" y="44" class="eq">q = εσ (T⁴ − T_amb⁴)</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="30" y="400" class="small">注：本图例用于 `docs/SPMe_Thermal2D_Theory_vs_Code.md` 第5节的边界条件；与实现中的 Bi 定义和装配公式一致。</text>
</svg>